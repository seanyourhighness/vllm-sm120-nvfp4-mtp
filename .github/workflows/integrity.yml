name: release-integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts, Compose, checksums, and patch applicability
        env:
          CHECK_PATCH_APPLY: "1"
        run: ./scripts/check-release.sh
