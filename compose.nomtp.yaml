services:
  server:
    container_name: vllm-sm120-nvfp4-nomtp
    command:
      - --model
      - ${MODEL_ID}
      - --revision
      - ${MODEL_REVISION}
      - --served-model-name
      - ${SERVED_MODEL_NAME}
      - qwen38-nvfp4-armb-mtp1-g1-fullpw-vision
      - qwen38-nvfp4-armb-mtp1-g1-fullpw-vision-64k
      - --quantization
      - modelopt
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":false,"reasoning_effort":"medium"}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --chat-template
      - /opt/vllm-release/chat-template.jinja
      - --enable-mm-embeds
      - --limit-mm-per-prompt
      - '{"image":0,"video":0}'
      - --kv-cache-dtype
      - nvfp4
      - --kv-cache-memory-bytes
      - "8589934592"
      - --mamba-ssm-cache-dtype
      - float32
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "4096"
      - --long-prefill-token-threshold
      - "2048"
      - --scheduling-policy
      - priority
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32]}'
      - --attention-config
      - '{"flash_attn_version":2}'
